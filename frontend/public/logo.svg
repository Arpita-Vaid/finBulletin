<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Green gradient background -->
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="100" cy="100" r="100" fill="url(#greenGradient)"/>
  
  <!-- Outer white circle border -->
  <circle cx="100" cy="100" r="100" fill="none" stroke="white" stroke-width="12"/>
  
  <!-- Chart bars -->
  <rect x="50" y="120" width="12" height="40" fill="white" rx="2"/>
  <rect x="70" y="100" width="12" height="60" fill="white" rx="2"/>
  <rect x="90" y="80" width="12" height="80" fill="white" rx="2"/>
  <rect x="110" y="60" width="12" height="100" fill="white" rx="2"/>
  
  <!-- Trend arrow line -->
  <polyline points="130,90 150,70 160,80" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="130" y1="90" x2="150" y2="70" stroke="white" stroke-width="8" stroke-linecap="round"/>
</svg>